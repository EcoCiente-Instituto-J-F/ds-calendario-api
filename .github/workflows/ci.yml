name: CI - ds-calendario-api

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: calendario_test
          POSTGRES_USER: calendario
          POSTGRES_PASSWORD: calendario

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/calendario_test
      DB_USER: calendario
      DB_PASSWORD: calendario
      JWT_SECRET: ecociente-ci-test-secret-key-0123456789
      SPRING_JPA_HIBERNATE_DDLAUTO: create-drop

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar testes
        run: ./gradlew clean test --no-daemon

      - name: Gerar aplicacao Spring Boot
        run: ./gradlew bootJar -x test --no-daemon